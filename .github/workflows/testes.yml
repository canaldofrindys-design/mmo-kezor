# Roda os testes do servidor e monta o servidor dedicado a cada envio e pull request.
name: Testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Testes
        run: dotnet test Build/Tests/Kezor.Tests.csproj -v minimal
      - name: Servidor dedicado (Linux)
        run: dotnet publish Build/Headless/Kezor.Server.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o Build/Publish/linux-x64
